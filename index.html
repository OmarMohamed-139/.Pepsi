<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Product Card - Pepsi</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- خلفية الرذاذ والقطرات الواقعية (تسقط من أعلى لأسفل) -->
    <div class="background-splash">
        <span class="drop"></span>
        <span class="drop"></span>
        <span class="drop"></span>
        <span class="drop"></span>
        <span class="drop"></span>
        <span class="drop"></span>
        <span class="drop"></span>
        <span class="drop"></span>
    </div>

    <!-- بطاقة المنتج الرئيسية -->
    <div class="product-card">
        <!-- الدائرة المتسعة -->
        <div class="circle">
            <div class="logo">
                <img src="pngwing.com (1).png" alt="Pepsi Logo">
            </div>
        </div>

        <!-- محتوى النص -->
        <div class="content">
            <h2>PEPSI COLA</h2>
            <p>Refresh your world with the authentic taste of Pepsi. Grab a cold can and enjoy the ultimate refreshment.
            </p>
            <a href="about.html" class="btn">Explore more</a>
        </div>

        <!-- علبة البيبسي المائلة -->
        <img src="pngwing.com.jpg" alt="Pepsi Can" class="product-img">
    </div>

</body>

</html>
